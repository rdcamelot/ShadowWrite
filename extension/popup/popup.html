<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>ShadowWrite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 280px;
      background: #16161e;
      color: #c0c0c8;
      font-size: 12px;
    }

    /* ── Header ──────────────────────────────── */
    .hdr {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 10px;
    }
    .hdr img { width: 28px; height: 28px; border-radius: 6px; }
    .hdr .t { font-size: 14px; font-weight: 600; color: #e0e0e8; }
    .hdr .v { font-size: 9px; color: #555; margin-left: 4px; }

    /* ── Status ──────────────────────────────── */
    .st {
      margin: 0 16px 10px;
      padding: 4px 10px;
      border-radius: 6px;
      background: #1c1c26;
      text-align: center;
      font-size: 10.5px;
      color: #555;
      min-height: 16px;
      transition: all 0.2s;
    }
    .st.ok  { color: #4ade80; background: rgba(74,222,128,0.08); }
    .st.err { color: #f87171; background: rgba(248,113,113,0.08); }

    /* ── Divider ─────────────────────────────── */
    .d { height: 1px; background: linear-gradient(90deg, transparent, #2a2a36, transparent); margin: 0 16px; }

    /* ── Section ─────────────────────────────── */
    .sec { padding: 10px 16px 6px; }
    .sec-l {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #4a4a54;
      margin-bottom: 8px;
    }

    /* ── Toggle ──────────────────────────────── */
    .tg {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 0;
    }
    .tg span { font-size: 11.5px; color: #a0a0a8; }
    .sw {
      position: relative;
      width: 32px; height: 18px;
      flex-shrink: 0;
    }
    .sw input { opacity: 0; width: 0; height: 0; position: absolute; }
    .sl {
      position: absolute; inset: 0;
      background: #333; border-radius: 18px;
      cursor: pointer; transition: 0.2s;
    }
    .sl::before {
      content: "";
      position: absolute;
      width: 12px; height: 12px;
      left: 3px; bottom: 3px;
      background: #777; border-radius: 50%;
      transition: 0.2s;
    }
    .sw input:checked + .sl { background: #e8a048; }
    .sw input:checked + .sl::before { transform: translateX(14px); background: #fff; }

    /* ── Input field ─────────────────────────── */
    .f { margin-bottom: 8px; }
    .f label {
      display: block;
      font-size: 9.5px;
      color: #555;
      margin-bottom: 3px;
    }
    .f input {
      width: 100%;
      padding: 5px 8px;
      background: #1c1c26;
      border: 1px solid #2a2a36;
      border-radius: 6px;
      color: #c0c0c8;
      font-size: 11.5px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .f input:focus { border-color: #e8a048; }
    .f input::placeholder { color: #3a3a44; }

    /* Inline row */
    .r { display: flex; gap: 6px; }
    .r .f { flex: 1; }
    .r .f.pt { max-width: 64px; }

    /* ── Browse button ────────────────────────── */
    .dir-row {
      display: flex;
      gap: 4px;
      align-items: stretch;
    }
    .dir-row .f { flex: 1; margin-bottom: 0; }
    .dir-btn {
      flex-shrink: 0;
      width: 28px;
      background: #1c1c26;
      border: 1px solid #2a2a36;
      border-radius: 6px;
      color: #777;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, color 0.2s;
      margin-top: 14px; /* align with input (accounting for label) */
    }
    .dir-btn:hover { border-color: #e8a048; color: #e8a048; }

    .hint {
      font-size: 9px;
      color: #555;
      margin-top: 3px;
      padding-left: 2px;
    }



    /* ── Footer ──────────────────────────────── */
    .ft {
      padding: 6px 16px 10px;
      text-align: center;
      font-size: 9px;
      color: #2a2a34;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="hdr">
    <img src="../icons/icon48.png" alt="ShadowWrite">
    <div>
      <span class="t">ShadowWrite</span>
      <span class="v">v0.1.0</span>
    </div>
  </div>

  <!-- Status -->
  <div class="st" id="status">…</div>

  <!-- Capture -->
  <div class="sec">
    <div class="sec-l">捕获</div>
    <div class="tg">
      <span>当前对话追踪</span>
      <label class="sw"><input type="checkbox" id="trackingToggle"><span class="sl"></span></label>
    </div>
    <div class="tg">
      <span>自动追踪新对话</span>
      <label class="sw"><input type="checkbox" id="autoCapture" checked><span class="sl"></span></label>
    </div>
  </div>

  <div class="d"></div>

  <!-- Server -->
  <div class="sec">
    <div class="sec-l">本地服务</div>
    <div class="r">
      <div class="f">
        <label>Host</label>
        <input type="text" id="host" value="127.0.0.1" placeholder="127.0.0.1">
      </div>
      <div class="f pt">
        <label>Port</label>
        <input type="number" id="port" value="24601" placeholder="24601">
      </div>
    </div>
  </div>

  <div class="d"></div>

  <!-- Output (loaded from server) -->
  <div class="sec">
    <div class="sec-l">输出</div>
    <div class="f">
      <label id="outputDirLabel">输出目录</label>
      <div class="dir-row">
        <div class="f">
          <input type="text" id="outputDir" value="" placeholder="(从服务器加载)">
        </div>
        <button class="dir-btn" id="browseDir" title="浏览…">📂</button>
        <button class="dir-btn" id="resetDir" title="恢复全局默认" style="display:none">↩</button>
      </div>
      <div class="hint" id="outputDirHint" style="display:none"></div>
    </div>
    <div class="tg">
      <span>生成 Chat HTML</span>
      <label class="sw"><input type="checkbox" id="chatHtml"><span class="sl"></span></label>
    </div>
  </div>

  <div class="ft">silent sync · local markdown</div>

  <script src="popup.js"></script>
</body>
</html>
