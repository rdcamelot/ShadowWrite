<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>ShadowWrite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 300px;
      padding: 16px;
      background: #1a1a2e;
      color: #e0e0e0;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #333;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #89b4fa;
    }
    .header .version {
      font-size: 11px;
      color: #888;
    }

    /* Toggle switch */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .toggle-row label {
      font-size: 13px;
    }
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #444;
      border-radius: 22px;
      transition: 0.2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }
    .switch input:checked + .slider { background: #22c55e; }
    .switch input:checked + .slider::before { transform: translateX(18px); }

    /* Form fields */
    .field {
      margin-bottom: 12px;
    }
    .field label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 4px;
    }
    .field input {
      width: 100%;
      padding: 6px 8px;
      background: #2a2a3e;
      border: 1px solid #444;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
    }
    .field input:focus {
      border-color: #89b4fa;
    }
    .row {
      display: flex;
      gap: 8px;
    }
    .row .field { flex: 1; }
    .row .field.port { max-width: 80px; }

    /* Status */
    .status {
      font-size: 11px;
      color: #888;
      text-align: center;
      margin-top: 8px;
      min-height: 16px;
    }
    .status.ok { color: #22c55e; }
    .status.err { color: #ef4444; }
  </style>
</head>
<body>
  <div class="header">
    <h1>ShadowWrite</h1>
    <span class="version">v0.1.0</span>
  </div>

  <div class="toggle-row">
    <label>启用实时捕获</label>
    <label class="switch">
      <input type="checkbox" id="enabled" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <label>自动捕获新对话</label>
    <label class="switch">
      <input type="checkbox" id="autoCapture" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="row">
    <div class="field">
      <label>Host</label>
      <input type="text" id="host" value="127.0.0.1" placeholder="127.0.0.1">
    </div>
    <div class="field port">
      <label>Port</label>
      <input type="number" id="port" value="24601" placeholder="24601">
    </div>
  </div>

  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
